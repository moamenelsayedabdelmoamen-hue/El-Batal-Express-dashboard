name: Cloud Functions Quality Gate

on:
  push:
    branches:
      - main
      - fix/live-readiness-mainline
    paths:
      - "functions/**"
      - ".github/workflows/functions-quality.yml"
  pull_request:
    paths:
      - "functions/**"
      - ".github/workflows/functions-quality.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Compile Cloud Functions
        run: npm run build

      - name: Run order lifecycle and dispatch tests
        run: node --test test/ordersService.test.mjs
